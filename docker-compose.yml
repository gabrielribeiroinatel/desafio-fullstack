services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: indicators
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/indicators
    ports:
      - "8001:8000"
    depends_on:
      - db

  frontend-angular:
    build: ./frontend-angular
    ports:
      - "4200:80"
    depends_on:
      - backend

  frontend-react:
    build: ./frontend-react
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: